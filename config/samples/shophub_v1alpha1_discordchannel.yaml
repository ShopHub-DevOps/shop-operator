apiVersion: v1
kind: Secret
metadata:
  name: discord-webhook-demo
  namespace: default
type: Opaque
stringData:
  # Replace this with your real Discord webhook URL before applying.
  url: "https://discord.com/api/webhooks/REPLACE_ME/REPLACE_ME"
---
apiVersion: shophub.io/v1alpha1
kind: DiscordChannel
metadata:
  name: demo-alerts
  namespace: default
  labels:
    app.kubernetes.io/name: discordchannel
    app.kubernetes.io/instance: demo-alerts
spec:
  channelName: "demo-store-alerts"
  webhookSecretRef:
    name: discord-webhook-demo
    key: url
  shopRef: demo-store
  minSeverity: warning
