# This kustomization bundles all CRDs under config/crd/bases for the
# `make install` target. controller-gen regenerates the YAML in `bases/`,
# this file just lists them so kustomize can stream them to kubectl.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bases/shophub.io_shops.yaml
